name: dev-log
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devlog
      POSTGRES_USER: devlog
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/setup-local.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlog -d devlog"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/devlog
      DATABASE_USERNAME: devlog
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/setup-local.py first}
      BLOG_ADMIN_TOKEN: ${BLOG_ADMIN_TOKEN:?Run python3 scripts/setup-local.py first}
      BLOG_CONTENT_ROOT: /content
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./frontend/content:/content:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
