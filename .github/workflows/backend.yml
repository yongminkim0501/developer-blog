name: Backend checks
on:
  push:
    paths: ['backend/**', 'frontend/content/**', 'compose.yaml', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'frontend/content/**', 'compose.yaml', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: ./gradlew test bootJar --no-daemon
