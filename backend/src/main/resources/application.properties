spring.application.name=blog-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/devlog}
spring.datasource.username=${DATABASE_USERNAME:devlog}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
blog.content-root=${BLOG_CONTENT_ROOT:../frontend/content}
blog.content.source=${BLOG_CONTENT_SOURCE:local}
blog.content.github.repo=${BLOG_CONTENT_GITHUB_REPO:}
blog.content.github.branch=${BLOG_CONTENT_GITHUB_BRANCH:main}
blog.content.github.path=${BLOG_CONTENT_GITHUB_PATH:frontend/content}
blog.content.github.token=${BLOG_CONTENT_GITHUB_TOKEN:}
blog.admin-token=${BLOG_ADMIN_TOKEN:}
blog.index.enabled=${BLOG_INDEX_ENABLED:true}
blog.index.interval-ms=${BLOG_INDEX_INTERVAL_MS:30000}
